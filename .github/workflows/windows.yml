name: Build Windows EXE
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'android/app/src/main/java/com/btsou/search/Source.java', 'android/app/src/main/java/com/btsou/search/Result.java', 'android/app/src/main/java/com/btsou/search/SearchEngine.java', 'android/app/src/main/java/com/btsou/search/TapSequence.java', 'android/app/src/main/java/com/btsou/search/LinkHealth.java', 'android/app/src/main/assets/sources.json', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate packaged Windows runtime
        run: python desktop/build.py --package
      - name: Exercise desktop and pagination on Windows
        shell: pwsh
        run: |
          $process = Start-Process -FilePath desktop/build/release/Xunyuan-Windows-0.1.7.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Single EXE smoke test failed' }
          if (-not (Test-Path desktop-smoke.png)) { throw 'Desktop screenshot missing' }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path desktop/build/release/Xunyuan-Windows-0.1.7.exe))
          if ($null -eq $icon) { throw 'EXE icon missing' }
          $bitmap = $icon.ToBitmap()
          $green = 0
          for ($x=0; $x -lt $bitmap.Width; $x++) {
            for ($y=0; $y -lt $bitmap.Height; $y++) {
              $pixel = $bitmap.GetPixel($x,$y)
              if ($pixel.G -gt 50 -and $pixel.G -gt ($pixel.R*1.15) -and $pixel.G -gt ($pixel.B*0.95)) { $green++ }
            }
          }
          if ($green -lt 20) { throw 'Expected jade compass EXE icon was not found' }
          $bitmap.Save('exe-icon.png', [System.Drawing.Imaging.ImageFormat]::Png)
          $bitmap.Dispose(); $icon.Dispose()

      - uses: actions/upload-artifact@v4
        with:
          name: Xunyuan-Windows
          path: |
            desktop/build/release/*
            desktop-smoke.png
            exe-icon.png
      - name: Publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows-v0.1.7 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-v0.1.7 --target $env:GITHUB_SHA --title '寻源 Windows 0.1.7 · 单文件便携版' --notes-file desktop/README.md --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload windows-v0.1.7 desktop/build/release/Xunyuan-Windows-0.1.7.exe desktop/build/release/SHA256SUMS.txt desktop/build/release/build-report.json desktop-smoke.png exe-icon.png --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
